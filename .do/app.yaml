# DigitalOcean App Platform: https://ops.simex.kobolabs.dev (the Django app in web/).
# Delivers injects by email (Resend) or, as the backup, in the in-app SIMEX Mail inboxes
# (Settings > Delivery channel). Personas send from and receive at @simex.kobolabs.dev.
# The first, FastAPI version of the app is in app/ with its spec in .do/app-fastapi.yaml
# (rollback: render that spec and `doctl apps update`).
#
# Update:  .venv/bin/python .do/render_spec.py <app-id>   (copies the app's encrypted secrets)
#          doctl apps update <app-id> --spec .do/app.rendered.yaml && rm .do/app.rendered.yaml
#
# Secrets have no value here on purpose (an update replaces the whole spec). Render a copy
# with the values before `doctl apps create/update --spec`, and delete it afterwards.
#
# Database: its own database and user (simex_ops) on the existing cluster risa-dash-db (the account
# is at its database limit), given as the DATABASE_URL secret, with the app added to the
# cluster's trusted sources:  doctl databases firewalls append <cluster-id> --rule app:<app-id>
#
# AI analysis (optional, Settings → AI analysis): add to envs, then render as above, either
#   - { key: ANTHROPIC_API_KEY, scope: RUN_TIME, type: SECRET }            (Claude API), or
#   - { key: AWS_BEARER_TOKEN_BEDROCK, scope: RUN_TIME, type: SECRET }     (Bedrock API key)
#   - { key: AWS_REGION, scope: RUN_TIME, value: "us-east-1" }
# and add the key's name to SECRETS in .do/render_spec.py.
#
# Two components share the image: web (gunicorn, migrations at start) and scheduler (a
# worker running `manage.py run_scheduler`). Exactly one scheduler instance.
name: simex-ops
region: fra
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
domains:
  # The app lives on ops.: simex.kobolabs.dev itself carries the MX record for replies.
  - domain: ops.simex.kobolabs.dev
    type: PRIMARY
    zone: kobolabs.dev
envs:
  - { key: DATABASE_URL, scope: RUN_TIME, type: SECRET }
  - { key: SECRET_KEY, scope: RUN_AND_BUILD_TIME, type: SECRET }
  - { key: APP_PASSWORD, scope: RUN_TIME, type: SECRET }
  - { key: RESEND_API_KEY, scope: RUN_TIME, type: SECRET }
  - { key: RESEND_WEBHOOK_SECRET, scope: RUN_TIME, type: SECRET }
  - { key: APP_USERNAME, scope: RUN_TIME, value: "undac" }
  - { key: PUBLIC_URL, scope: RUN_TIME, value: "https://ops.simex.kobolabs.dev" }
  - { key: MAIL_DOMAIN, scope: RUN_TIME, value: "simex.kobolabs.dev" }
  - { key: EXERCISE_TZ, scope: RUN_TIME, value: "Africa/Nairobi" }
services:
  - name: web
    github: { repo: joshuaberetta/simex-ops, branch: main, deploy_on_push: true }
    source_dir: web
    dockerfile_path: web/Dockerfile
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    health_check: { http_path: /healthz, initial_delay_seconds: 20, period_seconds: 10, failure_threshold: 6 }
workers:
  - name: scheduler
    github: { repo: joshuaberetta/simex-ops, branch: main, deploy_on_push: true }
    source_dir: web
    dockerfile_path: web/Dockerfile
    run_command: python manage.py run_scheduler
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
