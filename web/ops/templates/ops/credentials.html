{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SIMEX logins</title>
<style>
body { font: 14px/1.4 system-ui, sans-serif; margin: 20px; }
.slip { border: 1px dashed #999; padding: 12px 16px; margin: 0 0 12px; page-break-inside: avoid; width: 46%; display: inline-block; vertical-align: top; box-sizing: border-box; margin-right: 3%; }
.slip b { font-size: 16px; }
code { font-size: 15px; }
@media print { button { display: none; } }
</style></head>
<body>
<button onclick="window.print()">Print</button>
<p>Sign in at <b>{{ url }}</b></p>
{% for row in rows %}
<div class="slip"><b>{{ row.0 }}</b> · {{ row.1 }}<br>
Site: {{ url }}<br>
Username: <code>{{ row.2 }}</code><br>
Password: <code>{{ row.3 }}</code></div>
{% endfor %}
</body></html>
